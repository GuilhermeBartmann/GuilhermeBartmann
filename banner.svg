<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Guilherme Bartmann, Full-stack Developer">
  <defs>
    <clipPath id="frame"><rect width="1200" height="400" rx="20"/></clipPath>

    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363D"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1200" height="400" fill="url(#fade)"/></mask>

    <radialGradient id="halo">
      <stop offset="0" stop-color="#FF7A1A" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FF7A1A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" gradientUnits="userSpaceOnUse" x1="70" y1="0" x2="400" y2="0">
      <stop offset="0" stop-color="#FF7A1A"/>
      <stop offset="1" stop-color="#FFC07A"/>
    </linearGradient>
    <linearGradient id="topLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A1A" stop-opacity="0"/>
      <stop offset=".6" stop-color="#FF7A1A"/>
      <stop offset="1" stop-color="#FF7A1A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A1A"/>
      <stop offset="1" stop-color="#FF7A1A" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }

    .lat  { fill: none; stroke: #FF7A1A; stroke-opacity: .3; stroke-width: 1.2; }
    .dot  { fill: none; stroke: #FFA05C; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 0 15; }
    .spin { animation: spin 22s linear infinite; }
    .wobble { animation: wobble 12s ease-in-out infinite; }
    .appear { animation: appear 1.6s cubic-bezier(.2,.7,.2,1) both; }
    .orbit { fill: none; stroke: #FF7A1A; stroke-opacity: .35; stroke-width: 1; stroke-dasharray: 2 10; animation: flow 1.4s linear infinite; }

    .rise { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
    .r1 { animation-delay: .1s; }
    .r2 { animation-delay: .25s; }
    .r3 { animation-delay: .4s; }
    .r4 { animation-delay: .55s; }
    .r5 { animation-delay: .7s; }
    .grow { animation: grow 1.2s .6s cubic-bezier(.2,.7,.2,1) both; transform-origin: 72px 0; }
    .pulse { animation: blink 2s ease-in-out infinite; }
    .cursor { animation: cursor 1s steps(1) infinite; }

    @keyframes spin   { to { transform: rotate(360deg); } }
    @keyframes wobble { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    @keyframes appear { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: none; } }
    @keyframes flow   { to { stroke-dashoffset: -24; } }
    @keyframes rise   { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes grow   { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes blink  { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    @keyframes cursor { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .particle { display: none; }
    }
  </style>

  <g clip-path="url(#frame)">
    <!-- fundo -->
    <rect width="1200" height="400" fill="#0D1117"/>
    <rect width="1200" height="400" fill="url(#grid)" mask="url(#gridMask)"/>
    <circle cx="900" cy="200" r="300" fill="url(#halo)"/>
    <rect width="1200" height="2" fill="url(#topLine)"/>

    <!-- toro 3D -->
    <g transform="translate(900 200)">
      <g class="appear">
        <g class="wobble">
          <g transform="rotate(-30) scale(.8)">

            <ellipse class="orbit" rx="270" ry="85"/>
            <circle class="particle" r="4" fill="#FFD2A8" filter="url(#glow)">
              <animateMotion dur="9s" repeatCount="indefinite" path="M-270 0 A270 85 0 1 1 270 0 A270 85 0 1 1 -270 0"/>
            </circle>

            <g transform="translate(0 0) scale(1 .5)"><circle class="lat" r="210"/><g class="spin"><circle class="dot" r="210" pathLength="360"/></g></g>
            <g transform="translate(0 -13.5) scale(1 .5)"><circle class="lat" r="208"/><g class="spin"><circle class="dot" r="208" pathLength="360"/></g></g>
            <g transform="translate(0 -26) scale(1 .5)"><circle class="lat" r="202"/><g class="spin"><circle class="dot" r="202" pathLength="360"/></g></g>
            <g transform="translate(0 -36.8) scale(1 .5)"><circle class="lat" r="192"/><g class="spin"><circle class="dot" r="192" pathLength="360"/></g></g>
            <g transform="translate(0 -45) scale(1 .5)"><circle class="lat" r="180"/><g class="spin"><circle class="dot" r="180" pathLength="360"/></g></g>
            <g transform="translate(0 -50.2) scale(1 .5)"><circle class="lat" r="166"/><g class="spin"><circle class="dot" r="166" pathLength="360"/></g></g>
            <g transform="translate(0 -52) scale(1 .5)"><circle class="lat" r="150"/><g class="spin"><circle class="dot" r="150" pathLength="360"/></g></g>
            <g transform="translate(0 -50.2) scale(1 .5)"><circle class="lat" r="134"/><g class="spin"><circle class="dot" r="134" pathLength="360"/></g></g>
            <g transform="translate(0 -45) scale(1 .5)"><circle class="lat" r="120"/><g class="spin"><circle class="dot" r="120" pathLength="360"/></g></g>
            <g transform="translate(0 -36.8) scale(1 .5)"><circle class="lat" r="108"/><g class="spin"><circle class="dot" r="108" pathLength="360"/></g></g>
            <g transform="translate(0 -26) scale(1 .5)"><circle class="lat" r="98"/><g class="spin"><circle class="dot" r="98" pathLength="360"/></g></g>
            <g transform="translate(0 -13.5) scale(1 .5)"><circle class="lat" r="92"/><g class="spin"><circle class="dot" r="92" pathLength="360"/></g></g>
            <g transform="translate(0 0) scale(1 .5)"><circle class="lat" r="90"/><g class="spin"><circle class="dot" r="90" pathLength="360"/></g></g>
            <g transform="translate(0 13.5) scale(1 .5)"><circle class="lat" r="92"/><g class="spin"><circle class="dot" r="92" pathLength="360"/></g></g>
            <g transform="translate(0 26) scale(1 .5)"><circle class="lat" r="98"/><g class="spin"><circle class="dot" r="98" pathLength="360"/></g></g>
            <g transform="translate(0 36.8) scale(1 .5)"><circle class="lat" r="108"/><g class="spin"><circle class="dot" r="108" pathLength="360"/></g></g>
            <g transform="translate(0 45) scale(1 .5)"><circle class="lat" r="120"/><g class="spin"><circle class="dot" r="120" pathLength="360"/></g></g>
            <g transform="translate(0 50.2) scale(1 .5)"><circle class="lat" r="134"/><g class="spin"><circle class="dot" r="134" pathLength="360"/></g></g>
            <g transform="translate(0 52) scale(1 .5)"><circle class="lat" r="150"/><g class="spin"><circle class="dot" r="150" pathLength="360"/></g></g>
            <g transform="translate(0 50.2) scale(1 .5)"><circle class="lat" r="166"/><g class="spin"><circle class="dot" r="166" pathLength="360"/></g></g>
            <g transform="translate(0 45) scale(1 .5)"><circle class="lat" r="180"/><g class="spin"><circle class="dot" r="180" pathLength="360"/></g></g>
            <g transform="translate(0 36.8) scale(1 .5)"><circle class="lat" r="192"/><g class="spin"><circle class="dot" r="192" pathLength="360"/></g></g>
            <g transform="translate(0 26) scale(1 .5)"><circle class="lat" r="202"/><g class="spin"><circle class="dot" r="202" pathLength="360"/></g></g>
            <g transform="translate(0 13.5) scale(1 .5)"><circle class="lat" r="208"/><g class="spin"><circle class="dot" r="208" pathLength="360"/></g></g>

          </g>
        </g>
      </g>
    </g>

    <!-- detalhes técnicos -->
    <text class="mono rise r4" x="1160" y="44" font-size="12" fill="#6E7681" text-anchor="end">// torus.render({ wireframe: true })</text>
    <text class="mono rise r5" x="1160" y="370" font-size="12" fill="#6E7681" text-anchor="end">Juiz de Fora · BR</text>

    <!-- identidade -->
    <g class="rise r1">
      <circle class="pulse" cx="78" cy="116" r="4" fill="#FF7A1A" filter="url(#glow)"/>
      <text class="mono" x="92" y="121" font-size="13" letter-spacing="3" fill="#FF7A1A">FULL-STACK DEVELOPER</text>
    </g>

    <text class="sans rise r2" x="70" y="196" font-size="68" font-weight="700" fill="#F0F6FC" letter-spacing="-1.5">Guilherme</text>
    <text class="sans rise r3" x="70" y="266" font-size="68" font-weight="700" fill="url(#nameGrad)" letter-spacing="-1.5">Bartmann</text>

    <rect class="grow" x="72" y="292" width="140" height="2" rx="1" fill="url(#divider)"/>

    <text class="sans rise r4" x="72" y="330" font-size="18" fill="#8B949E">Aplicações web, APIs e automações que escalam.</text>
    <g class="rise r5">
      <text class="mono" x="72" y="360" font-size="13" fill="#6E7681">React · NestJS · Laravel · TypeScript · AWS</text>
      <rect class="cursor" x="432" y="349" width="7" height="14" fill="#FF7A1A"/>
    </g>
  </g>
</svg>
