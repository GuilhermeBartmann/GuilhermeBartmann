<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Guilherme Bartmann, Full-stack Developer">
  <defs>
    <clipPath id="frame"><rect width="1200" height="400" rx="20"/></clipPath>

    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363D"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1200" height="400" fill="url(#fade)"/></mask>

    <radialGradient id="orbCyan">
      <stop offset="0" stop-color="#61DAFB" stop-opacity=".28"/>
      <stop offset="1" stop-color="#61DAFB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbViolet">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameGrad" gradientUnits="userSpaceOnUse" x1="70" y1="0" x2="420" y2="0">
      <stop offset="0" stop-color="#61DAFB"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="topLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#61DAFB" stop-opacity="0"/>
      <stop offset=".5" stop-color="#61DAFB"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#61DAFB"/>
      <stop offset="1" stop-color="#61DAFB" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }

    .rise  { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
    .r1 { animation-delay: .1s; }
    .r2 { animation-delay: .25s; }
    .r3 { animation-delay: .4s; }
    .r4 { animation-delay: .55s; }
    .r5 { animation-delay: .7s; }
    .grow  { animation: grow 1.2s .6s cubic-bezier(.2,.7,.2,1) both; transform-origin: 72px 0; }
    .drift1 { animation: drift1 14s ease-in-out infinite; }
    .drift2 { animation: drift2 18s ease-in-out infinite; }
    .flow  { stroke-dasharray: 3 9; animation: flow 1.1s linear infinite; }
    .pulse { animation: blink 2s ease-in-out infinite; }
    .cursor { animation: cursor 1s steps(1) infinite; }

    @keyframes rise   { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes grow   { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes drift1 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-60px, 30px); } }
    @keyframes drift2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(70px, -25px); } }
    @keyframes flow   { to { stroke-dashoffset: -24; } }
    @keyframes blink  { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    @keyframes cursor { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .packet { display: none; }
    }
  </style>

  <g clip-path="url(#frame)">
    <!-- fundo -->
    <rect width="1200" height="400" fill="#0D1117"/>
    <circle class="drift1" cx="1000" cy="60" r="360" fill="url(#orbCyan)"/>
    <circle class="drift2" cx="160" cy="380" r="340" fill="url(#orbViolet)"/>
    <rect width="1200" height="400" fill="url(#dots)" mask="url(#gridMask)"/>
    <rect width="1200" height="2" fill="url(#topLine)"/>

    <!-- identidade -->
    <g class="rise r1">
      <circle class="pulse" cx="78" cy="116" r="4" fill="#61DAFB" filter="url(#glow)"/>
      <text class="mono" x="92" y="121" font-size="13" letter-spacing="3" fill="#61DAFB">FULL-STACK DEVELOPER</text>
    </g>

    <text class="sans rise r2" x="70" y="196" font-size="68" font-weight="700" fill="#F0F6FC" letter-spacing="-1.5">Guilherme</text>
    <text class="sans rise r3" x="70" y="266" font-size="68" font-weight="700" fill="url(#nameGrad)" letter-spacing="-1.5">Bartmann</text>

    <rect class="grow" x="72" y="292" width="140" height="2" rx="1" fill="url(#divider)"/>

    <text class="sans rise r4" x="72" y="330" font-size="18" fill="#8B949E">Aplicações web, APIs e automações que escalam.</text>
    <g class="rise r5">
      <text class="mono" x="72" y="360" font-size="13" fill="#6E7681">React · NestJS · Laravel · TypeScript · AWS</text>
      <rect class="cursor" x="432" y="349" width="7" height="14" fill="#61DAFB"/>
    </g>

    <!-- painel -->
    <g class="rise r3">
      <rect x="610" y="40" width="570" height="320" rx="14" fill="#161B22" fill-opacity=".72" stroke="#30363D"/>
      <circle cx="634" cy="58" r="5" fill="#30363D"/>
      <circle cx="652" cy="58" r="5" fill="#30363D"/>
      <circle cx="670" cy="58" r="5" fill="#30363D"/>
      <text class="mono" x="690" y="62" font-size="12" fill="#8B949E">system/architecture.ts</text>
      <circle class="pulse" cx="1106" cy="58" r="4" fill="#3FB950"/>
      <text class="mono" x="1160" y="62" font-size="12" fill="#3FB950" text-anchor="end">live</text>
      <line x1="610" y1="76" x2="1180" y2="76" stroke="#30363D"/>

      <!-- conexões -->
      <g fill="none" stroke="#30363D" stroke-width="1.5">
        <path d="M764 150 C800 150 800 170 836 170"/>
        <path d="M764 150 C800 150 800 270 836 270"/>
        <path d="M764 290 C800 290 800 170 836 170"/>
        <path d="M764 290 C800 290 800 270 836 270"/>
        <path d="M964 170 C1000 170 1000 130 1036 130"/>
        <path d="M964 170 C1000 170 1000 220 1036 220"/>
        <path d="M964 270 C1000 270 1000 220 1036 220"/>
        <path d="M964 270 C1000 270 1000 310 1036 310"/>
      </g>
      <g class="flow" fill="none" stroke="#61DAFB" stroke-opacity=".55" stroke-width="1.5">
        <path d="M764 150 C800 150 800 170 836 170"/>
        <path d="M764 150 C800 150 800 270 836 270"/>
        <path d="M764 290 C800 290 800 170 836 170"/>
        <path d="M764 290 C800 290 800 270 836 270"/>
        <path d="M964 170 C1000 170 1000 130 1036 130"/>
        <path d="M964 170 C1000 170 1000 220 1036 220"/>
        <path d="M964 270 C1000 270 1000 220 1036 220"/>
        <path d="M964 270 C1000 270 1000 310 1036 310"/>
      </g>

      <!-- pacotes de dados -->
      <g class="packet" filter="url(#glow)">
        <circle r="3" fill="#61DAFB"><animateMotion dur="1.8s" repeatCount="indefinite" path="M764 150 C800 150 800 170 836 170"/></circle>
        <circle r="3" fill="#61DAFB"><animateMotion dur="2.3s" repeatCount="indefinite" path="M764 290 C800 290 800 270 836 270"/></circle>
        <circle r="3" fill="#61DAFB"><animateMotion dur="2.7s" repeatCount="indefinite" path="M764 150 C800 150 800 270 836 270"/></circle>
        <circle r="3" fill="#E0234E"><animateMotion dur="2s" repeatCount="indefinite" path="M964 170 C1000 170 1000 130 1036 130"/></circle>
        <circle r="3" fill="#E0234E"><animateMotion dur="2.5s" repeatCount="indefinite" path="M964 170 C1000 170 1000 220 1036 220"/></circle>
        <circle r="3" fill="#FF2D20"><animateMotion dur="2.2s" repeatCount="indefinite" path="M964 270 C1000 270 1000 310 1036 310"/></circle>
        <circle r="3" fill="#FF2D20"><animateMotion dur="2.9s" repeatCount="indefinite" path="M964 270 C1000 270 1000 220 1036 220"/></circle>
      </g>

      <!-- nós -->
      <g class="mono" font-size="13" fill="#E6EDF3">
        <rect x="636" y="130" width="128" height="40" rx="10" fill="#0D1117" stroke="#30363D"/>
        <circle cx="654" cy="150" r="4" fill="#61DAFB"/>
        <text x="666" y="155">React</text>

        <rect x="636" y="270" width="128" height="40" rx="10" fill="#0D1117" stroke="#30363D"/>
        <circle cx="654" cy="290" r="4" fill="#61DAFB"/>
        <text x="666" y="295">React Native</text>

        <rect x="836" y="150" width="128" height="40" rx="10" fill="#0D1117" stroke="#30363D"/>
        <circle cx="854" cy="170" r="4" fill="#E0234E"/>
        <text x="866" y="175">NestJS</text>

        <rect x="836" y="250" width="128" height="40" rx="10" fill="#0D1117" stroke="#30363D"/>
        <circle cx="854" cy="270" r="4" fill="#FF2D20"/>
        <text x="866" y="275">Laravel</text>

        <rect x="1036" y="110" width="128" height="40" rx="10" fill="#0D1117" stroke="#30363D"/>
        <circle cx="1054" cy="130" r="4" fill="#5B9BD5"/>
        <text x="1066" y="135">MySQL</text>

        <rect x="1036" y="200" width="128" height="40" rx="10" fill="#0D1117" stroke="#30363D"/>
        <circle cx="1054" cy="220" r="4" fill="#FF9900"/>
        <text x="1066" y="225">SQS · SNS</text>

        <rect x="1036" y="290" width="128" height="40" rx="10" fill="#0D1117" stroke="#30363D"/>
        <circle class="pulse" cx="1054" cy="310" r="4" fill="#A78BFA"/>
        <text x="1066" y="315">AI · RAG</text>
      </g>
    </g>
  </g>
</svg>
